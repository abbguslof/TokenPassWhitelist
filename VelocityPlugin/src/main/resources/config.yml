# HTTP server bind address
ip: 0.0.0.0
port: 5000

# Secret token for API requests (set securely)
api_secret: "REPLACE_ME"

# Domain used in invite links
website_domain: "invite.example.com"

# Console command used to whitelist a player
whitelist_command: "whitelist add "

# Command to execute to list the current whitelist
whitelist_list_command: "whitelist list"

# Command to execute to remove a player from the whitelist
# The username will be appended to this string, so keep a trailing space if needed!
whitelist_remove_command: "whitelist remove "

# Password required to generate invites via admin panel
admin_password: "change_me_now"
